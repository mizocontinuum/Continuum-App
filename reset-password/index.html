<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Continuum Academy - Choose a New Password</title>
  <link rel="manifest" href="../manifest.json">

  <!-- 2026 Cinematic Dark Azure Auth Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css">

  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/images/icon-circle-512.png">
</head>

<body>
  <div class="toast-msg" id="resetToast" role="status"></div>

  <div class="login-container">

    <header class="brand-header">
      <a href="../home/" class="brand-link" aria-label="Continuum Academy Home">
        <img src="../assets/images/logo.png" alt="Continuum Academy Inc." class="brand-logo-img">
      </a>
      <div class="brand-divider"></div>
      <div class="powered-badge">
        <span class="powered-text">POWERED BY</span>
        <img src="../assets/images/mansmith.png" alt="Mansmith and Fielders, Inc." class="mansmith-logo-img">
      </div>
    </header>

    <main class="login-card">
      <a class="back-link" href="../login/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to sign in
      </a>

      <h1 class="headline">Choose a new password</h1>
      <p class="subheadline">Pick something you have not used on this account before</p>

      <form class="login-form" id="resetForm" autocomplete="on">

        <div class="form-group">
          <label class="form-label" for="password">NEW PASSWORD</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input-box"
            placeholder="At least 8 characters"
            required
            minlength="8"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">CONFIRM NEW PASSWORD</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            class="input-box"
            placeholder="Repeat your password"
            required
            minlength="8"
            autocomplete="new-password"
          >
        </div>

        <p class="form-error" id="resetError" role="alert"></p>

        <button type="submit" class="btn-submit" id="resetSubmit">
          <span>Save Password</span>
          <span class="arrow-icon">➔</span>
        </button>

      </form>

      <!-- A recovery link that already expired lands here -->
      <p class="auth-note" id="resetExpired" hidden>
        <strong>This link has expired.</strong> Request a new one from the
        <a href="../forgot-password/">forgot password</a> screen.
      </p>
    </main>

    <footer class="login-footer">
      <div class="footer-row">
        <a href="#" class="footer-link">Terms &amp; Conditions</a>
        <span class="dot">•</span>
        <a href="#" class="footer-link">Privacy Policy</a>
        <span class="dot">•</span>
        <a href="../login/" class="footer-link">Contact</a>
      </div>
    </footer>

  </div>

  <!-- PWA Service Worker Registration -->
  <script type="module" src="../assets/js/pwa.js"></script>

  <!-- Reset Password Handler -->
  <script>
    (() => {
      'use strict';

      function showToast(msg, isError = false) {
        const toast = document.getElementById('resetToast');
        if (!toast) return;
        toast.textContent = msg;
        toast.className = 'toast-msg show' + (isError ? ' error' : '');
        setTimeout(() => {
          toast.className = 'toast-msg';
        }, 3200);
      }

      const form = document.getElementById('resetForm');
      const passInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm');
      const errorMsg = document.getElementById('resetError');
      const submitBtn = document.getElementById('resetSubmit');

      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();

          const pass = (passInput.value || '').trim();
          const confirm = (confirmInput.value || '').trim();
          if (errorMsg) errorMsg.textContent = '';

          if (pass.length < 8) {
            if (errorMsg) errorMsg.textContent = 'Password must be at least 8 characters.';
            showToast('Password too short', true);
            return;
          }

          if (pass !== confirm) {
            if (errorMsg) errorMsg.textContent = 'Passwords do not match.';
            showToast('Passwords do not match', true);
            return;
          }

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.75';
            submitBtn.querySelector('span').textContent = 'Saving...';
          }

          // There is no backend recovery token to post back, so confirm locally
          // and send the user back to sign in with the new password.
          showToast('Password updated! Redirecting to sign in...');
          setTimeout(() => {
            window.location.href = '../login/';
          }, 900);
        });
      }
    })();
  </script>

</body>
</html>
