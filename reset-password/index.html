<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Choose a new password for your Continuum Academy account and continue your learning journey.">
  <title>Continuum Academy - Choose a New Password</title>

  <!-- Google Font Sora for Crisp Modern UI -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
  <!-- 2026 Unified Cinematic Dark Azure Auth Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css?v=5">

  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/images/icon-circle-512.png">
</head>

<body>
  <div class="toast-msg" id="resetToast" role="status"></div>

  <div class="login-container">

    <div class="auth-portal-grid">
      <main class="login-card">
      <a class="back-link" href="../login/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to sign in
      </a>

      <h1 class="headline">Choose a new password</h1>
      <p class="subheadline">Pick something you have not used on this account before</p>

      <form class="login-form" id="resetForm" autocomplete="on">

        <div class="form-group">
          <label class="form-label" for="password">NEW PASSWORD</label>
          <div class="pw-wrap" style="position:relative;">
            <input
              type="password"
              id="password"
              name="password"
              class="input-box"
              placeholder="At least 8 characters"
              required
              minlength="8"
              autocomplete="new-password"
            >
            <button type="button" class="pw-toggle" id="toggleResetPass" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm">CONFIRM NEW PASSWORD</label>
          <div class="pw-wrap" style="position:relative;">
            <input
              type="password"
              id="confirm"
              name="confirm"
              class="input-box"
              placeholder="Repeat your password"
              required
              minlength="8"
              autocomplete="new-password"
            >
            <button type="button" class="pw-toggle" id="toggleResetConfirm" aria-label="Toggle confirm password visibility">Show</button>
          </div>
        </div>

        <p class="form-error" id="resetError" role="alert"></p>

        <button type="submit" class="btn-submit" id="resetSubmit">
          <span>Save Password</span>
          <span class="arrow-icon">➔</span>
        </button>

      </form>

      <!-- Missing, expired, malformed, or already-used recovery links land here -->
      <p class="auth-note" id="resetExpired" hidden>
        <strong>This reset link is invalid or has expired.</strong> Request a new one from the
        <a href="../forgot-password/index.html" style="color:var(--azure-bright);font-weight:600;text-decoration:none;">forgot password</a> screen.
      </p>
    </main>
    </div>

  </div>

  <!-- Unified 3D Holographic Canvas & Aura Engine -->
  <script src="../assets/js/auth-pages.js?v=6"></script>
  <script src="../assets/js/auth-3d-logo.js?v=5"></script>

</body>
</html>
