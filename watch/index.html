<!DOCTYPE html>
<html lang="en" data-requires-auth>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Continuum Academy - Watch</title>

  <!-- Shared app foundation (top bar, tokens, toast, bottom nav) -->
  <link rel="stylesheet" href="../assets/css/base/foundation.css">
  <!-- Watch page: player stage, progress bar, actions -->
  <link rel="stylesheet" href="../assets/css/pages/watch.css">
  <!-- Light-theme variable overrides, then the navbar user menu -->
  <link rel="stylesheet" href="../assets/css/base/theme.css">
  <link rel="stylesheet" href="../assets/css/components/user-menu.css">

  <link rel="apple-touch-icon" href="../assets/images/icon-circle-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="../favicon.ico">
</head>

<body>
  <!-- Toast feedback notification -->
  <div class="toast-msg" id="pageToast" role="status"></div>

  <div class="app-container">

    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand">
        <a href="../home/" class="brand-link" aria-label="Continuum Academy Home">
          <img src="../assets/images/logo.png" alt="Continuum Academy Inc." class="brand-logo">
        </a>
      </div>
      <!-- /* nav-update */ Desktop Navigation Links -->
      <nav class="top-nav" aria-label="Main">
        <a class="top-nav-link" href="../home/">Home</a>
        <a class="top-nav-link" href="../disciplines/">Disciplines</a>
        <a class="top-nav-link" href="../library/">My Library</a>
      </nav>
      <div class="top-actions">
        <!-- /* nav-update */ Search -->
        <a class="icon-btn search-btn" href="../search/" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
          </svg>
        </a>

        <!-- Notification Bell -->
        <button class="icon-btn bell-btn" id="bellBtn" aria-label="Notifications">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <!-- User Avatar: opens the user menu (user-menu.js) -->
        <button class="avatar-btn" id="profileBtn" aria-label="Account menu">
          <span class="avatar-letter" data-session-initial></span>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-content watch-main">

      <!-- Back to the discipline this masterclass belongs to (rewritten by watch.js) -->
      <a class="watch-back" id="watchBack" href="../home/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="11 18 5 12 11 6"></polyline>
        </svg>
        Back
      </a>

      <!-- Player stage -->
      <section class="watch-stage" id="watchStage">
        <video class="watch-video" id="watchVideo" controls playsinline preload="metadata" aria-label="Masterclass player"></video>
        <p class="watch-note" id="watchNote" hidden></p>
      </section>

      <!-- Progress indicator (resume / completion) -->
      <div class="watch-progress" id="watchProgress" role="presentation">
        <span id="watchProgressFill"></span>
      </div>

      <!-- Metadata and actions, revealed once the video is resolved -->
      <section class="watch-meta" id="watchMeta" hidden>
        <span class="watch-tag" id="watchTag"></span>
        <h1 class="watch-title" id="watchTitle"></h1>
        <p class="watch-speaker" id="watchSpeaker"></p>

        <div class="watch-actions">
          <button class="watch-btn" id="favoriteBtn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span id="favoriteLabel">My List</span>
          </button>

          <button class="watch-btn" id="shareBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
            <span>Share</span>
          </button>
        </div>
      </section>

      <!-- Shown when the video id is missing or unknown -->
      <p class="watch-missing" id="watchMissing" hidden>
        <span data-watch-missing-text>That masterclass isn’t in the catalogue.</span>
        <a href="../home/">Back to home</a>
      </p>

      <noscript>
        <p class="watch-missing">Enable JavaScript to play this masterclass.</p>
      </noscript>

    </main>

    <!-- /* nav-update */ Floating Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav-container" aria-label="Main">
      <div class="floating-nav">
        <!-- Home -->
        <a class="nav-tab" href="../home/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">Home</span>
        </a>
        <!-- Disciplines -->
        <a class="nav-tab" href="../disciplines/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </div>
          <span class="nav-label">Disciplines</span>
        </a>
        <!-- Search -->
        <a class="nav-tab" href="../search/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <span class="nav-label">Search</span>
        </a>
        <!-- My Library -->
        <a class="nav-tab" href="../library/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="8" y1="7" x2="16" y2="7"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </div>
          <span class="nav-label">My Library</span>
        </a>
      </div>
    </nav>

  </div>

  <!-- Page module: playback, resume, progress saving and My List toggle -->
  <script type="module" src="../assets/js/pages/watch.js"></script>
  <!-- PWA Service Worker Registration -->
  <script type="module" src="../assets/js/pwa.js"></script>

</body>
</html>
