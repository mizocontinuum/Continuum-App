<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Reset your Continuum Academy password and regain access to your executive learning account.">
  <title>Continuum Academy - Forgot Password</title>

  <!-- Google Font Sora for Crisp Modern UI -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
  <!-- 2026 Unified Cinematic Dark Azure Auth Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css?v=5">

  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/images/icon-circle-512.png">
</head>

<body>
  <div class="toast-msg" id="forgotToast" role="status"></div>

  <div class="login-container">

    <div class="auth-portal-grid">
      <main class="login-card">
      <a class="back-link" href="../login/index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to sign in
      </a>

      <h1 class="headline">Forgot password</h1>
      <p class="subheadline" id="forgotSubhead">For this local demo, enter your account email to create a one-time reset link</p>

      <form class="login-form" id="forgotForm" autocomplete="on">

        <div class="form-group">
          <label class="form-label" for="email">EMAIL ADDRESS</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input-box"
            placeholder="name@company.com"
            required
            autocomplete="email"
          >
        </div>

        <p class="form-error" id="forgotError" role="alert"></p>

        <button type="submit" class="btn-submit" id="forgotSubmit">
          <span>Create Reset Link</span>
          <span class="arrow-icon">➔</span>
        </button>

      </form>

      <!-- Shown after a successful request, replaces the form -->
      <div class="auth-note" id="forgotSent" hidden>
        <strong>Reset link created.</strong> Email delivery is not configured yet, so use the link below.
        The link expires in one hour and can be used once.
        <p><a id="forgotResetLink" href="../reset-password/index.html">Open reset link</a></p>
      </div>

      <p class="auth-alt">
        Remembered it? <a href="../login/index.html" style="color:var(--azure-bright);font-weight:600;text-decoration:none;">Sign in</a>
      </p>
    </main>
    </div>

  </div>

  <!-- Unified 3D Holographic Canvas & Aura Engine -->
  <script src="../assets/js/auth-pages.js?v=7"></script>
  <script src="../assets/js/auth-3d-logo.js?v=5"></script>

</body>
</html>
