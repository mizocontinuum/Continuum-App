<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Continuum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pages/home.css">
</head>
<body>
<nav>
  <a class="logo" href="#home" aria-label="Continuum Academy home"><img class="lg-full" src="../assets/images/logo.png" alt="Continuum Academy Inc."><img class="lg-icon" src="../assets/images/logo.png" alt="" aria-hidden="true"></a>
  <ul class="links">
    <li><a href="#home" data-r="home">Home</a></li>
    <li><a href="#movies" data-r="movies">Movies</a></li>
    <li><a href="#series" data-r="series">Series</a></li>
    <li><a href="#cartoons" data-r="cartoons">Library</a></li>
    <li><a href="#mylist" data-r="mylist">My list</a></li>
    <li class="ind" aria-hidden="true"></li>
  </ul>
  <div class="tools">
    <input id="q" type="text" placeholder="Search a title..." aria-label="Search titles">
    <button class="icon" id="qb" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <div class="avatar" role="img" aria-label="Your profile"></div>
  </div>
</nav>
<iframe id="f" title="Page content"></iframe>

<div class="np" id="np" tabindex="-1" role="dialog" aria-modal="true" aria-label="Video player" hidden>
  <div class="np-stage"><div class="np-art" id="npArt"></div><video id="npVid" playsinline hidden></video></div>
  <div class="np-demo" id="npDemo">DEMO PLAYBACK</div>
  <div class="np-spin"><i></i></div>
  <div class="np-flash" id="npFlash"><svg class="f-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><svg class="f-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div class="np-top"><button class="np-ico" id="npBack" aria-label="Back to browse"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button></div>
  <button class="np-skip" id="npSkip">Skip Intro</button>
  <div class="np-bottom">
    <div class="np-pwrap">
      <div class="np-prog" id="npProg" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="np-fill" id="npFill"></div><div class="np-dot" id="npDot"></div><div class="np-tip" id="npTip">0:00</div></div>
      <span class="np-left" id="npLeft">0:00</span>
    </div>
    <div class="np-row">
      <div class="np-l">
        <button class="np-ico" id="npPlay" aria-label="Play or pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
        <button class="np-ico" id="npRew" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11.5 4.5V1.5L7 5.5l4.5 4V6.5a6.5 6.5 0 1 1-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="17" text-anchor="middle" font-size="7.5" font-weight="700" font-family="Poppins,sans-serif">10</text></svg></button>
        <button class="np-ico" id="npFwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12.5 4.5V1.5L17 5.5l-4.5 4V6.5A6.5 6.5 0 1 0 19 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="17" text-anchor="middle" font-size="7.5" font-weight="700" font-family="Poppins,sans-serif">10</text></svg></button>
        <div class="np-vol"><button class="np-ico" id="npMute" aria-label="Mute"><svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><input id="npVol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
      </div>
      <div class="np-title"><b id="npTitle"></b><span id="npSub"></span></div>
      <div class="np-r">
        <button class="np-chip" id="npNext" hidden><svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zM17 5v14h2V5z"/></svg><span>Next Episode</span></button>
        <button class="np-chip" id="npSpeed" aria-label="Playback speed">1x</button>
        <button class="np-ico" id="npFs" aria-label="Fullscreen"><svg class="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="i-xfs" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/pages/home-data.js"></script>
<script src="../assets/js/pages/home.js"></script>
</body>
</html>
