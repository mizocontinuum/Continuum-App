<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Continuum Academy</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/pages/home.css">
</head>
<body>
  <nav>
    <a class="logo" href="#home" aria-label="Continuum Academy home">
      <img src="../assets/images/logo.png" alt="Continuum Academy" style="height:36px;width:auto;object-fit:contain;display:block;">
    </a>
    <ul class="links">
      <li><a href="#home" data-r="home">Home</a></li>
      <li><a href="#movies" data-r="movies">Movies</a></li>
      <li><a href="#series" data-r="series">Series</a></li>
      <li><a href="#mylist" data-r="mylist">My list</a></li>
      <li><a href="#cartoons" data-r="cartoons">Cartoons</a></li>
      <li class="ind" aria-hidden="true"></li>
    </ul>
    <div class="tools">
      <input id="q" type="text" placeholder="Search a title..." aria-label="Search titles" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="icon" id="qb" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <div class="avatar" role="img" aria-label="Your profile"></div>
    </div>
  </nav>
  <iframe id="f" title="Page content"></iframe>
  <div id="st" role="status" aria-live="polite"></div>

  <!-- Reorganized Scripts -->
  <script src="../assets/js/pages/home-data.js"></script>
  <script src="../assets/js/pages/home.js"></script>
</body>
</html>
