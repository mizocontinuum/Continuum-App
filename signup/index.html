<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description"
    content="Access or create your executive Continuum Academy account — for entrepreneurs, marketers and leaders.">
  <meta name="theme-color" content="#03080E">
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Continuum Academy - Create Account">
  <meta property="og:description" content="Access or create your executive Continuum Academy account.">
  <meta property="og:image" content="https://continuumacademy.com/assets/images/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Continuum Academy - Create Account</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
  <!-- 2026 Clean Consolidated Dark Azure Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css?v=5">
</head>

<body>
  <!-- Toast feedback notification -->
  <div class="toast-msg" id="signupToast" role="status"></div>

  <div class="login-container">

    <!-- Top Brand Header with Continuum Logo (left) and Powered By Mansmith (right) -->

    <!-- Side-by-Side Executive Portal Body -->
    <div class="auth-portal-grid">

      <!-- Right Column: Main Login Card -->
      <main class="login-card">



      <h1 class="headline" id="signupHeading">Create your account</h1>
        <p class="subheadline" id="signupSubheading">Join verified leaders, founders and business professionals</p>

        <form class="login-form" id="signupForm" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="fullName">FULL LEGAL NAME</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="input-box"
              placeholder="e.g. Maria Santos"
              required
              autocomplete="name"
              minlength="2"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">WORK / PERSONAL EMAIL</label>
            <input
              type="email"
              id="signupEmail"
              name="signupEmail"
              class="input-box"
              placeholder="name@company.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="signup-details">
            <div class="form-group">
              <label class="form-label" for="jobRole">PRIMARY ROLE</label>
              <select id="jobRole" name="jobRole" class="input-box select-custom">
                <option value="Executive Leader" style="background:#071225;color:#fff;">Executive Leader</option>
                <option value="Entrepreneur / Founder" style="background:#071225;color:#fff;">Entrepreneur</option>
                <option value="Marketing Director" style="background:#071225;color:#fff;">Marketing Director</option>
                <option value="Business Strategist" style="background:#071225;color:#fff;">Strategist</option>
                <option value="Student / Fellow" style="background:#071225;color:#fff;">Student / Fellow</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="organization">ORGANIZATION</label>
              <input
                type="text"
                id="organization"
                name="organization"
                class="input-box"
                placeholder="Company / School"
                autocomplete="organization"
              >
            </div>
          </div>

          <div class="form-group">
            <div class="form-label-row" style="display:flex;justify-content:space-between;align-items:center;">
              <label class="form-label" for="signupPassword">PASSWORD</label>
              <span id="passStrengthLabel" style="font-size:0.75rem;font-weight:600;color:var(--text-muted);">Min. 8 characters</span>
            </div>
            <div class="pw-wrap" style="position:relative;">
              <input
                type="password"
                id="signupPassword"
                name="signupPassword"
                class="input-box"
                placeholder="At least 8 characters"
                required
                minlength="8"
                autocomplete="new-password"
              >
              <button type="button" class="pw-toggle" id="toggleSignupPass" aria-label="Toggle password visibility">Show</button>
            </div>
            <div style="height:4px;width:100%;background:rgba(255,255,255,0.08);border-radius:4px;margin-top:6px;overflow:hidden;">
              <div id="strengthBar" style="height:100%;width:0%;transition:width 0.3s, background 0.3s;"></div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">CONFIRM PASSWORD</label>
            <div class="pw-wrap" style="position:relative;">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="input-box"
                placeholder="Repeat your password"
                required
                minlength="8"
                autocomplete="new-password"
              >
              <button type="button" class="pw-toggle" id="toggleConfirmPass" aria-label="Toggle confirm password visibility">Show</button>
            </div>
          </div>

          <div style="display:flex;align-items:flex-start;gap:10px;margin-top:2px;">
            <input type="checkbox" id="termsCheck" required style="margin-top:4px;accent-color:var(--azure-bright);cursor:pointer;">
            <label for="termsCheck" style="font-size:0.8rem;color:var(--text-muted);line-height:1.4;cursor:pointer;">
              I agree to the <button type="button" class="legal-link" data-legal="terms">Continuum Demo Terms</button> and <button type="button" class="legal-link" data-legal="privacy">Privacy Policy</button>.
            </label>
          </div>

          <p class="form-error" id="signupError" role="alert" style="color:#FF4D6D;font-size:13px;margin:2px 0 6px;min-height:18px;"></p>

          <button type="submit" class="btn-submit" id="signupSubmitBtn">
            <span>Create Account</span>
            <span class="arrow-icon">➔</span>
          </button>
        </form>

        <p class="auth-alt" style="margin-top:16px;font-size:13px;text-align:center;color:var(--text-muted);">
          Already have an account? <a href="../login/index.html" style="color:var(--azure-bright);font-weight:600;text-decoration:none;">Sign in here</a>
        </p>



      <p class="auth-demo-note">Local demo: credentials stay in this browser. Email delivery and reCAPTCHA are not connected. <button type="button" class="legal-link" data-legal="privacy">Privacy</button> • <button type="button" class="legal-link" data-legal="terms">Terms</button></p>
    </main>

    </div><!-- /auth-portal-grid -->

    <!-- Footer Links -->

  </div>

  <!-- Auth Shared Animations (Consistent & Zero-lag) -->
<script src="../assets/js/auth-pages.js?v=5"></script>
  <script src="../assets/js/auth-3d-logo.js?v=5"></script>


  <!-- Signup Script -->
</body>

</html>
