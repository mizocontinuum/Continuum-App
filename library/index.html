<!DOCTYPE html>
<html lang="en" data-requires-auth>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Continuum Academy - My Library</title>

  <!-- Shared app foundation (top bar, masthead, artwork, modal, bottom nav) -->
  <link rel="stylesheet" href="../assets/css/base/foundation.css">
  <!-- My Library page: dashboard, tabs, filter rows -->
  <link rel="stylesheet" href="../assets/css/pages/library.css">
  <!-- Light-theme variable overrides, then the navbar user menu -->
  <link rel="stylesheet" href="../assets/css/base/theme.css">
  <link rel="stylesheet" href="../assets/css/components/user-menu.css">

  <link rel="apple-touch-icon" href="../assets/images/icon-circle-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png">
  <link rel="shortcut icon" href="../favicon.ico">
</head>

<body>
  <!-- Toast feedback notification -->
  <div class="toast-msg" id="pageToast" role="status"></div>

  <div class="app-container">

    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="brand">
        <a href="../home/" class="brand-link" aria-label="Continuum Academy Home">
          <img src="../assets/images/logo.png" alt="Continuum Academy Inc." class="brand-logo">
        </a>
      </div>
      <div class="top-actions">
        <!-- Notification Bell -->
        <button class="icon-btn bell-btn" id="bellBtn" aria-label="Notifications">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>

        <!-- User Avatar: opens the user menu (user-menu.js) -->
        <button class="avatar-btn" id="profileBtn" aria-label="Account menu">
          <span class="avatar-letter" data-session-initial></span>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-content library-main">

      <!-- Page masthead -->
      <header class="page-head">
        <h1 class="page-title">My Learning Library</h1>
        <p class="page-sub">Monitor and resume your executive video topics, review completed frameworks, and organize your saved watchlist.</p>
      </header>

      <!-- Shortcut into the free discipline catalogue -->
      <a class="browse-btn" href="../explore/">
        <svg class="browse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span>Browse All Disciplines</span>
        <svg class="browse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
      </a>

      <div class="page-rule" role="presentation"></div>

      <!-- Lifetime totals, rendered from assets/js/data/library.js -->
      <div class="stat-grid" id="statGrid"></div>

      <!-- Views over the library -->
      <div class="lib-tabs" id="libTabs" role="tablist" aria-label="Library views"></div>

      <!-- Search and discipline filter -->
      <div class="lib-tools">
        <label class="lib-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="libSearch"
            placeholder="Search library..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search your library">
        </label>

        <div class="lib-filter">
          <select id="libFilter" aria-label="Filter by discipline"></select>
          <svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

      <!-- Rows for the selected view -->
      <div class="library-list" id="libraryList" role="tabpanel" aria-label="Library videos"></div>

      <div class="lib-empty" id="libEmpty" hidden>
        <p id="libEmptyText">Nothing saved here yet.</p>
        <button class="lib-reset" id="libReset" type="button" hidden>Clear filters</button>
      </div>

      <noscript>
        <p class="lib-empty">Enable JavaScript to see your library.</p>
      </noscript>
    </main>

    <!-- Floating Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav-container" aria-label="Mobile Navigation">
      <div class="floating-nav">
        <!-- Home -->
        <a class="nav-tab" href="../home/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">Home</span>
        </a>
        <!-- Disciplines -->
        <a class="nav-tab" href="../disciplines/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </div>
          <span class="nav-label">Disciplines</span>
        </a>
        <!-- Search -->
        <a class="nav-tab" href="../search/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <span class="nav-label">Search</span>
        </a>
        <!-- My Library -->
        <a class="nav-tab active" href="../library/" aria-current="page">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="8" y1="7" x2="16" y2="7"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </div>
          <span class="nav-label">My Library</span>
        </a>
      </div>
    </nav>

  </div>

  <!-- Page module: My List (favorites) + Continue Watching (progress) -->
  <script type="module" src="../assets/js/pages/library.js"></script>
  <!-- PWA Service Worker Registration -->
  <script type="module" src="../assets/js/pwa.js"></script>

</body>
</html>
