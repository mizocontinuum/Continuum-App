<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description"
    content="Sign in to Continuum Academy — the executive learning cockpit for entrepreneurs, marketers and leaders.">
  <title>Continuum Academy - Login</title>

  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="../assets/images/icon-circle-512.png">

  <!-- 2026 Cinematic Dark Azure Auth Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body>
  <!-- Ambient Spline 3D Holographic Glass Core in Background -->
  <div class="auth-spline-stage" aria-hidden="true">
    <canvas id="authSplineCanvas" width="600" height="600"></canvas>
  </div>

  <!-- Toast feedback notification -->
  <div class="toast-msg" id="loginToast" role="status"></div>

  <div class="login-container">

    <!-- Top Brand Header with Continuum Logo (left) and Powered By Mansmith (right) -->
    <header class="brand-header">
      <a href="../index.html" class="brand-link" aria-label="Continuum Academy Home">
        <img src="../assets/images/logo.png" alt="Continuum Academy Inc." class="brand-logo-img">
      </a>
      <div class="powered-badge">
        <span class="powered-text">POWERED BY</span>
        <img src="../assets/images/mansmith.png" alt="Mansmith and Fielders, Inc." class="mansmith-logo-img">
      </div>
    </header>

    <!-- Main Login Card (Steady, Balanced 3D Glass Holographic Cockpit) -->
    <main class="login-card">
      <h1 class="headline" id="loginHeading">Welcome back</h1>
      <p class="subheadline" id="loginSubheading">Enter your credentials to access your executive learning cockpit</p>

      <form class="login-form" id="loginForm" autocomplete="on">

        <!-- Email Input Field -->
        <div class="form-group">
          <label class="form-label" for="email">EMAIL ADDRESS</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input-box"
            placeholder="name@company.com"
            required
            autocomplete="email"
          >
        </div>

        <!-- Password Input Field -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">PASSWORD</label>
            <a href="../forgot-password/" class="forgot-link">Forgot Password ?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            class="input-box"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <!-- Where a rejected sign-in lands -->
        <p class="form-error" id="loginError" role="alert"></p>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">
          <span>Sign In</span>
          <span class="arrow-icon">➔</span>
        </button>

      </form>

      <!-- Second step, revealed only when the account has two-factor enabled -->
      <form class="login-form" id="mfaForm" hidden autocomplete="on">
        <p class="field-hint">Enter the 6-digit code from your authenticator app.</p>

        <div class="form-group">
          <label class="form-label" for="mfaCode">AUTHENTICATOR CODE</label>
          <input
            type="text"
            id="mfaCode"
            name="mfaCode"
            class="input-box"
            placeholder="123456"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            required
          >
        </div>

        <p class="form-error" id="mfaError" role="alert"></p>

        <button type="submit" class="btn-submit" id="mfaSubmit">
          <span>Verify Code</span>
          <span class="arrow-icon">➔</span>
        </button>
      </form>

      <!-- Social sign-in options -->
      <div id="altOptions">
        <div class="auth-divider">or continue with</div>

        <div class="oauth-row">
          <button type="button" class="oauth-btn" data-provider="google">
            <span>Google</span>
          </button>

          <button type="button" class="oauth-btn" data-provider="azure">
            <span>Microsoft</span>
          </button>
        </div>
      </div>

      <!-- Sign Up Prompt -->
      <p class="signup-hint">
        Don't have an account ? <a href="../signup/" class="signup-link">Start Free</a>
      </p>
    </main>

    <!-- Footer Links -->
    <footer class="login-footer">
      <div class="footer-row">
        <a href="#" class="footer-link">Terms &amp; Conditions</a>
        <span class="dot">•</span>
        <a href="#" class="footer-link">Privacy Policy</a>
        <span class="dot">•</span>
        <a href="#" class="footer-link">Recurring Terms</a>
      </div>
      <div class="footer-row">
        <a href="#" class="footer-link">Refund Policy</a>
        <span class="dot">•</span>
        <a href="#" class="footer-link">Contact</a>
      </div>
    </footer>

  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Auth Shared Animations (Consistent & Zero-lag) -->
  <script src="../assets/js/auth-animations.js"></script>

</body>

</html>
