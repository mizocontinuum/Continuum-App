<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03080E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description"
    content="Access or create your executive Continuum Academy account — for entrepreneurs, marketers and leaders.">
  <title>Continuum Academy - Sign In</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap">
  <!-- 2026 Clean Consolidated Dark Azure Stylesheet -->
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body>
  <!-- Toast feedback notification -->
  <div class="toast-msg" id="loginToast" role="status"></div>

  <div class="login-container">

    <!-- Top Brand Header with Continuum Logo (left) and Powered By Mansmith (right) -->

    <!-- Side-by-Side Executive Portal Body -->
    <div class="auth-portal-grid">

      <!-- Right Column: Main Login Card -->
      <main class="login-card">



      <h1 class="headline" id="loginHeading">Welcome back</h1>
        <p class="subheadline" id="loginSubheading">Enter your credentials to access your executive learning cockpit</p>

        <form class="login-form" id="loginForm" autocomplete="on" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginEmail">EMAIL ADDRESS</label>
            <input
              type="email"
              id="loginEmail"
              name="email"
              class="input-box"
              placeholder="name@company.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label class="form-label" for="loginPassword">PASSWORD</label>
              <a href="../forgot-password/index.html" class="forgot-link" id="forgotPassBtn">Forgot password?</a>
            </div>
            <div class="pw-wrap" style="position:relative;">
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="input-box"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="pw-toggle" id="toggleLoginPass" aria-label="Toggle password visibility">Show</button>
            </div>
          </div>

          <p class="form-error" id="loginError" role="alert" style="color:#FF4D6D;font-size:13px;margin:2px 0 6px;min-height:18px;"></p>

          <button type="submit" class="btn-submit" id="loginSubmit">
            <span>Sign In</span>
            <span class="arrow-icon">➔</span>
          </button>
        </form>

        <details class="demo-credentials-box">
          <summary>Quick Demo Credentials</summary>
          <div class="demo-buttons-row">
            <button type="button" class="demo-fill-btn" id="demoAdminBtn">Fill Admin (admin@continuum.ph)</button>
            <button type="button" class="demo-fill-btn" id="demoStudentBtn">Fill Student (student@continuum.ph)</button>
          </div>
        </details>

        <p class="auth-alt" style="margin-top:16px;font-size:13px;text-align:center;color:var(--text-muted);">
          New to Continuum? <a href="../signup/index.html" style="color:var(--azure-bright);font-weight:600;text-decoration:none;">Create an account</a>
        </p>

      <p class="recaptcha-badge-note">Protected by Continuum Shield &amp; reCAPTCHA v3. <a href="#" style="color:inherit;">Privacy</a> • <a href="#" style="color:inherit;">Terms</a></p>
    </main>

    </div><!-- /auth-portal-grid -->

    <!-- Footer Links -->

  </div>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Auth Shared Animations (Consistent & Zero-lag) -->
<script src="../assets/js/auth-pages.js"></script>
  <script src="../assets/js/auth-3d-logo.js"></script>


  <!-- Login Script -->
</body>

</html>
